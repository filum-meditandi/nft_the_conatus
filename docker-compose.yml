version: '3.8'

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  db:
    image: postgres:15-alpine
    container_name: conatus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: conatus
      POSTGRES_PASSWORD: conatus
      POSTGRES_DB: phenomenological_evidence
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conatus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - conatus_network

  # =============================================================================
  # Application Server
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conatus_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Application
      ENVIRONMENT: development
      DEBUG: "true"

      # Database
      DATABASE_URL: postgresql://conatus:conatus@db:5432/phenomenological_evidence

      # API
      API_HOST: 0.0.0.0
      API_PORT: 8000

      # Cryptography (generate these for production!)
      # MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      # SECRET_KEY: ${SECRET_KEY}

      # Twilio (if using SMS)
      # TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      # TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      # TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}

      # Features
      HMM_ENABLED: "true"
      SMS_ENABLED: "false"  # Set to true and configure Twilio for SMS

    ports:
      - "8000:8000"
    volumes:
      # Mount source code for development (hot reload)
      - .:/app
      # Logs
      - app_logs:/app/logs
    networks:
      - conatus_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # =============================================================================
  # Database Administration (pgAdmin) - Optional
  # =============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: conatus_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@conatus.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - conatus_network
    profiles:
      - tools  # Only start with: docker-compose --profile tools up

# =============================================================================
# Networks
# =============================================================================
networks:
  conatus_network:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  app_logs:
    driver: local
